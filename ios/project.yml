name: FastingTracker
options:
  bundleIdPrefix: com.tomoaki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FastingTracker:
    type: application
    platform: iOS
    sources:
      - path: FastingTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomoaki.fastingtracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        UIUserInterfaceStyle: Dark
    info:
      path: FastingTracker/Info.plist
      properties:
        CFBundleName: "Fasting"
        CFBundleDisplayName: "Fasting Tracker"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
